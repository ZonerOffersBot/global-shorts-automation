name: Render approved Shorts

on:
  workflow_dispatch:
  schedule:
    # Daily at 13:00 UTC; adjust later using channel analytics.
    - cron: "0 13 * * *"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Render approved scripts
        run: python scripts/render_shorts.py
      - name: Save rendered videos as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-shorts
          path: output/*.mp4
          if-no-files-found: warn
          retention-days: 3
